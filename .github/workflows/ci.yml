name: CI

on:
  pull_request:
    branches:
      - main
      - release

jobs:
  validate-branch-name:
    name: validate-branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          BASE="${{ github.base_ref }}"
          echo "Checking branch name: $BRANCH (targeting $BASE)"

          # Allow pre-release branch for PRs to release
          if [[ "$BRANCH" == "pre-release" && "$BASE" == "release" ]]; then
            echo "Branch 'pre-release' is allowed for release PRs."
            exit 0
          fi

          # Must be <prefix>/<name>, with both parts in lowercase kebab-case
          if [[ ! "$BRANCH" =~ ^[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name must be <prefix>/<name> in lowercase kebab-case (e.g., feature/my-new-feature)"
            exit 1
          fi

          echo "Branch name is valid."

  check-formatting:
    name: check-formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  run-tests:
    name: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            dist/
            manifest.json
            popup/
            icons/
